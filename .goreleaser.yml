version: 2
project_name: vault-plugin-secrets-ghp

builds:
  - main: ./cmd/vault-plugin-secrets-ghp
    env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos: [linux]
    goarch: [amd64]

archives:
  - formats: [none]

nfpms:
  - &rpm
    id: vault
    package_name: vault-plugin-secrets-ghp
    bindir: /opt/vault-plugins
    scripts:
      preinstall: packaging/scripts/preinstall-vault.sh
    replaces: [vault-plugin-secrets-ghp]
    provides: [vault-plugin-secrets-ghp]
    formats: [rpm]
    file_name_template: "{{ .ConventionalFileName }}"
    release: "1"
    section: default
    priority: extra
    description: Vault/OpenBao secrets engine for ephemeral, scoped ghp access tokens
    maintainer: IUCLabs
    homepage: https://github.com/IUCLabs/vault-plugin-secrets-ghp
    license: MIT
  - <<: *rpm
    id: openbao
    package_name: openbao-plugin-secrets-ghp
    bindir: /opt/openbao-plugins
    scripts:
      preinstall: packaging/scripts/preinstall-openbao.sh
    replaces: [openbao-plugin-secrets-ghp]
    provides: [openbao-plugin-secrets-ghp]

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

signs:
  - artifacts: checksum
    cmd: scripts/sign.sh
    args: ["${artifact}", "${signature}"]

changelog:
  disable: true
